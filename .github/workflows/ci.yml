name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf install -y appstream gcc glib2-devel gtk4-devel meson zlib-devel
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: |
          meson setup build
          ninja -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
